name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14"]   # the range pyproject.toml allows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install ruff==0.16.10 pytest -e .
      - run: ruff check
      - run: pytest -q
      - run: shellcheck asr install.sh uninstall.sh
      - run: python -c "import faster_whisper, numpy, sounddevice, evdev"

  # Runs install.sh's system-package step, then the Python install, on each distro.
  # No mic, desktop or systemd session in a container, so no dictation.
  distros:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pre: what the uv installer needs on a bare image. tries: attempts for the package
          # steps; openSUSE's mirrors sometimes fail a refresh, so it retries.
          - image: fedora:latest
            pre: dnf install -y tar gzip
          - image: archlinux:latest
            pre: pacman -Syu --noconfirm
          - image: debian:stable
            pre: apt-get update && apt-get install -y curl ca-certificates
          - image: opensuse/tumbleweed
            pre: >-
              for i in 1 2 3; do zypper -n refresh && zypper -n install curl tar gzip gawk && break;
              [ $i = 3 ] && exit 1; echo "zypper failed, retrying in 30 s"; sleep 30; done
            tries: 3
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.pre }}
      - uses: actions/checkout@v5
      - run: |
          n=${{ matrix.tries || 1 }}
          for i in $(seq 1 "$n"); do
            bash install.sh --packages-only --yes && break
            [ "$i" = "$n" ] && exit 1
            echo "package step failed, retrying in 30 s"; sleep 30
          done
      - run: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e .
          .venv/bin/python -c "import faster_whisper, numpy, sounddevice, evdev"
          command -v xclip wl-copy zenity notify-send
          test -f /usr/share/sounds/freedesktop/stereo/device-added.oga

  # Builds whisper.cpp with Vulkan the way install.sh does for AMD and Intel GPUs. No GPU here,
  # so this checks the packages and the build, not transcription.
  vulkan:
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - run: apt-get update && apt-get install -y curl ca-certificates
      - uses: actions/checkout@v5
      - run: bash install.sh --packages-only --yes --engine=vulkan
      - run: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.12 .venv
          GGML_VULKAN=1 uv pip install --python .venv --no-binary pywhispercpp -e ".[vulkan]"
          ls .venv/lib/python3.12/site-packages/libggml-vulkan.so
          LD_LIBRARY_PATH=.venv/lib/python3.12/site-packages .venv/bin/python -c "from pywhispercpp.model import Model"

  # Builds the PyPI package and installs it like a user would, in a clean container.
  package:
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - run: apt-get update && apt-get install -y curl ca-certificates
      - uses: actions/checkout@v5
      - run: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build
          uv tool install dist/*.whl
          tuxwhisper setup --packages-only --yes
          tuxwhisper 2>&1 | grep -q "tuxwhisper setup"
          d=$(uv tool dir)/tuxwhisper/lib/python3*/site-packages/tuxwhisper/data
          ls $d/install.sh $d/uninstall.sh $d/tuxwhisper.service $d/tuxwhisper-settings.desktop $d/tuxwhisper.png
          $(uv tool dir)/tuxwhisper/bin/python -c "import faster_whisper, numpy, sounddevice, evdev"
