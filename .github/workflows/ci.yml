name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install ruff==0.16.10 -r requirements.txt
      - run: ruff check
      - run: shellcheck asr install.sh uninstall.sh
      - run: python -c "import faster_whisper, numpy, sounddevice, evdev"

  # Runs install.sh's system-package step, then the Python install, on each distro.
  # No mic, desktop or systemd session in a container, so no dictation.
  distros:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pre: what the uv installer needs on a bare image
          - image: fedora:latest
            pre: dnf install -y tar gzip
          - image: archlinux:latest
            pre: pacman -Syu --noconfirm
          - image: debian:stable
            pre: apt-get update && apt-get install -y curl ca-certificates
          - image: opensuse/tumbleweed
            pre: zypper -n install curl tar gzip gawk
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.pre }}
      - uses: actions/checkout@v5
      - run: bash install.sh --packages-only --yes
      - run: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements.txt
          .venv/bin/python -c "import faster_whisper, numpy, sounddevice, evdev"
          command -v xclip wl-copy zenity notify-send
          test -f /usr/share/sounds/freedesktop/stereo/device-added.oga
